<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>rulesEng · 数据源管理</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #f5f7fa; color: #1f2937; min-height: 100vh; }
  .topbar { height: 52px; background: #fff; border-bottom: 1px solid #e5e7eb;
            display: flex; align-items: center; padding: 0 24px; }
  .logo { font-weight: 600; font-size: 15px; margin-right: 32px; }
  .logo span { color: #3b82f6; }
  nav a { color: #6b7280; text-decoration: none; margin-right: 24px; font-size: 13px;
          padding: 6px 2px; border-bottom: 2px solid transparent; }
  nav a.active { color: #3b82f6; border-bottom-color: #3b82f6; }
  .content { max-width: 900px; margin: 24px auto; padding: 0 24px; }
  h1 { font-size: 18px; margin-bottom: 4px; }
  .sub { color: #6b7280; font-size: 12px; margin-bottom: 20px; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
  .card h2 { font-size: 13px; margin-bottom: 14px; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  label { display: block; font-size: 11px; color: #6b7280; margin: 8px 0 4px; }
  input, select { width: 100%; padding: 7px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
  .btn { background: #3b82f6; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-top: 14px; }
  .ds-item { padding: 14px; border: 1px solid #e5e7eb; border-radius: 6px; margin-bottom: 8px;
             display: flex; justify-content: space-between; align-items: center; }
  .ds-item .name { font-weight: 500; font-size: 13px; }
  .ds-item .meta { font-size: 11px; color: #6b7280; margin-top: 2px; }
  .ok-msg { background: #f0fdf4; color: #166534; padding: 10px 12px; border-radius: 6px; font-size: 12px; margin-top: 10px; }
  .muted { color: #9ca3af; font-size: 12px; }
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">rules<span>Eng</span></div>
  <nav>
    <a href="index.html">规则管理</a>
    <a href="datasource.html" class="active">数据源管理</a>
    <a href="actions.html">告警动作</a>
  </nav>
</div>

<div class="content">
  <h1>数据源管理</h1>
  <div class="sub">在这里登记业务数据库连接。变量与列的绑定在「规则管理」页内完成。</div>

  <div class="card">
    <h2>新增数据源</h2>
    <div class="row">
      <div><label>名称</label><input id="dsn" placeholder="例：披露库"></div>
      <div><label>类型</label><select id="dbtype"><option>mysql</option><option>postgres</option><option>kafka</option></select></div>
      <div><label>Host</label><input id="host" placeholder="10.0.0.5"></div>
    </div>
    <div class="row">
      <div><label>Port</label><input id="port" placeholder="3306"></div>
      <div><label>用户名</label><input id="user" placeholder="readonly"></div>
      <div><label>密码</label><input type="password" id="pass"></div>
    </div>
    <label>Schema / 库名</label><input id="schema" placeholder="disclosure_db">
    <button class="btn" onclick="addDs()">保存并测试连接</button>
    <div id="testResult"></div>
  </div>

  <div class="card">
    <h2>已登记数据源</h2>
    <div id="dsList"><div class="muted">暂无</div></div>
  </div>
</div>

<script>
const API = 'http://127.0.0.1:8081';
async function loadDs() {
  const r = await fetch(API + '/api/datasources');
  const list = await r.json();
  document.getElementById('dsList').innerHTML = list.length ? list.map(d => `
    <div class="ds-item">
      <div><div class="name">${d.name}</div><div class="meta">${d.db_type} · ${d.host}:${d.port}/${d.schema_name}</div></div>
      <button class="btn" style="margin:0;padding:5px 10px;font-size:11px" onclick="testDs(${d.id})">测试连接</button>
    </div>`).join('') : '<div class="muted">暂无</div>';
}
async function addDs() {
  const body = {
    name: dsn.value, db_type: dbtype.value, host: host.value,
    port: parseInt(port.value)||3306, username: user.value, schema_name: schema.value
  };
  await fetch(API + '/api/datasources', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  loadDs();
}
async function testDs(id) {
  const r = await fetch(API + '/api/datasources/' + id + '/test', {method:'POST'});
  const j = await r.json();
  document.getElementById('testResult').innerHTML = `<div class="ok-msg">✓ ${j.message || '连接成功'}</div>`;
}
loadDs();
</script>
</body>
</html>
