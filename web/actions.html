<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>rulesEng · 告警动作</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #f5f7fa; color: #1f2937; min-height: 100vh; }
  .topbar { height: 52px; background: #fff; border-bottom: 1px solid #e5e7eb;
            display: flex; align-items: center; padding: 0 24px; }
  .logo { font-weight: 600; font-size: 15px; color: #111827; margin-right: 32px; }
  .logo span { color: #3b82f6; }
  nav a { color: #6b7280; text-decoration: none; margin-right: 24px; font-size: 13px;
          padding: 6px 2px; border-bottom: 2px solid transparent; }
  nav a.active { color: #3b82f6; border-bottom-color: #3b82f6; }
  .content { max-width: 800px; margin: 24px auto; padding: 0 24px; }
  h1 { font-size: 18px; margin-bottom: 20px; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
  .card h2 { font-size: 13px; margin-bottom: 14px; }
  label { display: block; font-size: 11px; color: #6b7280; margin: 8px 0 4px; }
  input, select { width: 100%; padding: 7px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .btn { background: #3b82f6; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-top: 14px; }
  .act-item { padding: 12px; border: 1px solid #e5e7eb; border-radius: 6px; margin-bottom: 8px; font-size: 13px; }
  .act-item .type { display: inline-block; background: #eff6ff; color: #1d4ed8; padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-right: 8px; }
  .muted { color: #9ca3af; font-size: 12px; }
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">rules<span>Eng</span></div>
  <nav>
    <a href="index.html">规则管理</a>
    <a href="datasource.html">数据源绑定</a>
    <a href="actions.html" class="active">告警动作</a>
  </nav>
</div>

<div class="content">
  <h1>告警动作配置</h1>

  <div class="card">
    <h2>新增动作</h2>
    <label>绑定规则</label>
    <select id="ruleSel"></select>
    <div class="row" style="margin-top:8px">
      <div><label>类型</label>
        <select id="atype">
          <option value="sms">短信告警</option>
          <option value="http">调用微服务接口</option>
          <option value="email">邮件</option>
        </select>
      </div>
      <div><label>目标</label><input id="target" placeholder="手机号 / URL / 收件人"></div>
      <div><label>模板</label><input id="tpl" placeholder="公司{entity}触发告警"></div>
    </div>
    <button class="btn" onclick="addAct()">+ 添加动作</button>
  </div>

  <div class="card">
    <h2>已配置动作</h2>
    <div id="list"><div class="muted">暂无</div></div>
  </div>
</div>

<script>
const API = 'http://127.0.0.1:8081';
async function load() {
  const [rs, as] = await Promise.all([fetch(API+'/api/rules').then(r=>r.json()),
                                     fetch(API+'/api/actions').then(r=>r.json())]);
  document.getElementById('ruleSel').innerHTML = rs.map(r=>`<option value="${r.id}">${r.name}</option>`).join('') || '<option>无规则</option>';
  document.getElementById('list').innerHTML = as.length ? as.map(a => `
    <div class="act-item"><span class="type">${a.action_type}</span>${a.config}</div>`).join('')
    : '<div class="muted">暂无</div>';
}
async function addAct() {
  await fetch(API + '/api/actions', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({rule_id: parseInt(ruleSel.value), action_type: atype.value, config: target.value + ' | ' + tpl.value})});
  load();
}
load();
</script>
</body>
</html>
