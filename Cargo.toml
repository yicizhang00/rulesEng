[workspace]
resolver = "2"
members = [
    "crates/rules-ast",
    "crates/rules-parser",
    "crates/rules-dictionary",
    "crates/rules-verifier",
    "crates/rules-runtime",
    "crates/rules-dispatcher",
    "crates/rules-cli",
    "crates/rules-diff",
    "crates/rules-proof",
    "crates/rules-backtest",
    "crates/rules-flatvm",
    "crates/rules-smt",
    "crates/rules-server",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Proprietary"

[workspace.dependencies]
pest = "2.7"
pest_derive = "2.7"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
